name: CI/CD EventHub

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  # ─── CI : tests unitaires des 3 microservices ───────────────────────────
  test-backend:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - events-service
          - participants-service
          - registrations-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ─── CI : build frontend (Vite) ─────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_EVENTS_API_URL: http://localhost:3001
          VITE_PARTICIPANTS_API_URL: http://localhost:3002
          VITE_REGISTRATIONS_API_URL: http://localhost:3003

  # ─── CI : construction des images Docker ────────────────────────────────
  docker-build:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build events-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/events-service
          push: false
          tags: eventhub-events-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build participants-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/participants-service
          push: false
          tags: eventhub-participants-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build registrations-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/registrations-service
          push: false
          tags: eventhub-registrations-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: eventhub-frontend:ci
          build-args: |
            VITE_EVENTS_API_URL=http://localhost:3001
            VITE_PARTICIPANTS_API_URL=http://localhost:3002
            VITE_REGISTRATIONS_API_URL=http://localhost:3003
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── CD : publication des images sur GitHub Container Registry ──────────
  docker-push:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: events-service
            context: ./backend/events-service
          - image: participants-service
            context: ./backend/participants-service
          - image: registrations-service
            context: ./backend/registrations-service
          - image: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/eventhub-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_EVENTS_API_URL=${{ vars.PUBLIC_EVENTS_API_URL || 'http://localhost:3001' }}
            VITE_PARTICIPANTS_API_URL=${{ vars.PUBLIC_PARTICIPANTS_API_URL || 'http://localhost:3002' }}
            VITE_REGISTRATIONS_API_URL=${{ vars.PUBLIC_REGISTRATIONS_API_URL || 'http://localhost:3003' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ─── CD : déploiement auto (sans VPS) sur le runner Actions ─────────────
  # Tire les images GHCR, démarre la stack, vérifie /health, puis arrête.
  deploy:
    name: Deploy (staging CI)
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer .env
        run: |
          cp .env.example .env
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_OWNER=$OWNER" >> .env
          echo "IMAGE_TAG=latest" >> .env

      - name: Pull & démarrer la stack
        run: |
          set -e
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env up -d

      - name: Attendre les healthchecks
        run: |
          set -e
          for i in $(seq 1 30); do
            E=$(curl -sf http://localhost:3001/health && echo ok || echo fail)
            P=$(curl -sf http://localhost:3002/health && echo ok || echo fail)
            R=$(curl -sf http://localhost:3003/health && echo ok || echo fail)
            F=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost/ || true)
            echo "try $i — events=$E participants=$P registrations=$R frontend=$F"
            if [ "$E" = "ok" ] && [ "$P" = "ok" ] && [ "$R" = "ok" ] && [ "$F" = "200" ]; then
              echo "Deploy staging OK"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck timeout"
          docker compose -f docker-compose.prod.yml --env-file .env ps
          docker compose -f docker-compose.prod.yml --env-file .env logs --tail=80
          exit 1

      - name: Arrêter la stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env down -v
